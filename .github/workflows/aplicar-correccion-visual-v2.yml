name: Aplicar experiencia unificada

on:
  push:
    branches:
      - master
      - etapa-15-correccion-visual-v2
    paths:
      - .github/workflows/aplicar-correccion-visual-v2.yml
      - scripts/aplicar_correccion_visual_v2.py
      - css/experiencia-financiera-v2.css
      - js/experiencia-financiera-v2.js
      - css/deudas-redesign-v23.css
      - js/deudas-redesign-v23.js
      - css/deudas-fixes-v25.css
      - js/deudas-fixes-v25.js
      - css/tarjetas-consistencia-v26.css
      - js/tarjetas-consistencia-v26.js
      - css/experiencia-integrada-v27.css
      - css/experiencia-integrada-v28.css
      - css/experiencia-integrada-v29.css
      - css/experiencia-integrada-v30.css
      - css/experiencia-unificada-v32.css
      - js/experiencia-unificada-v32.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar rama activa
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Aplicar recursos en HTML y caché PWA
        run: python3 scripts/aplicar_correccion_visual_v2.py

      - name: Validar JavaScript activo
        run: |
          node --check js/app.js
          node --check js/experiencia-financiera-v2.js
          node --check js/deudas-redesign-v23.js
          node --check js/deudas-fixes-v25.js
          node --check js/tarjetas-consistencia-v26.js
          node --check js/experiencia-unificada-v32.js

      - name: Guardar archivos generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html firebase-messaging-sw.js
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes."
            exit 0
          fi
          git commit -m "Aplica experiencia unificada V32"
          git push origin "${GITHUB_REF_NAME}"