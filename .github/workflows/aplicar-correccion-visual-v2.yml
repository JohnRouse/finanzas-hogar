name: Validar experiencia financiera

on:
  push:
    branches:
      - master
      - etapa-15-correccion-visual-v2
      - etapa-16-identidad-y-navegacion
      - etapa-17-nav-avatar-flotante
      - etapa-18-estados-pagados-y-ahorro-real
    paths:
      - .github/workflows/aplicar-correccion-visual-v2.yml
      - js/app.js
      - js/sincronizacion-financiera-ui.js
      - js/bootstrap-avanzado.js
      - js/deudas-familiares.js
      - js/deudas-coordinator-v33-4.js
      - js/deudas-redesign-v23.js
      - js/deudas-fixes-v25.js
      - js/tarjetas-consistencia-v26.js
      - js/experiencia-financiera-v2.js
      - js/experiencia-unificada-v32.js
      - js/movimientos-unificados-v33.js
      - js/experiencia-auxiliar-v33.js
      - js/hotfix-v33-1.js
      - js/avatar-random-v33-2.js
      - js/identidad-navegacion-v34.js
      - js/estados-pagados-ahorro-real-v35.js
      - js/ahorro-resumen-v35.js
      - js/hotfix-etapa-18-beta2.js
      - js/diagnostico-etapa-18.js
      - css/experiencia-financiera-v2.css
      - css/deudas-redesign-v23.css
      - css/deudas-fixes-v25.css
      - css/tarjetas-consistencia-v26.css
      - css/experiencia-integrada-v27.css
      - css/experiencia-integrada-v28.css
      - css/experiencia-integrada-v29.css
      - css/experiencia-integrada-v30.css
      - css/experiencia-unificada-v32.css
      - css/identidad-navegacion-v34.css
      - css/estados-pagados-ahorro-real-v35.css
      - css/hotfix-etapa-18-beta2.css
      - icons/app-icon.svg
      - icons/app-icon-maskable.svg
      - index.html
      - manifest.json
      - VERSION
      - firebase-messaging-sw.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Validar JavaScript
        run: |
          node --check js/app.js
          node --check js/sincronizacion-financiera-ui.js
          node --check js/bootstrap-avanzado.js
          node --check js/deudas-familiares.js
          node --check js/deudas-coordinator-v33-4.js
          node --check js/deudas-redesign-v23.js
          node --check js/deudas-fixes-v25.js
          node --check js/tarjetas-consistencia-v26.js
          node --check js/experiencia-financiera-v2.js
          node --check js/experiencia-unificada-v32.js
          node --check js/movimientos-unificados-v33.js
          node --check js/experiencia-auxiliar-v33.js
          node --check js/hotfix-v33-1.js
          node --check js/avatar-random-v33-2.js
          node --check js/identidad-navegacion-v34.js
          node --check js/estados-pagados-ahorro-real-v35.js
          node --check js/ahorro-resumen-v35.js
          node --check js/hotfix-etapa-18-beta2.js
          node --check js/diagnostico-etapa-18.js
          node --check firebase-messaging-sw.js

      - name: Verificar estabilidad V33.4
        run: |
          grep -q "deudas-coordinator-v33-4.js" js/bootstrap-avanzado.js
          grep -q "renderizador antiguo fue retirado" js/deudas-familiares.js
          grep -q "const VERSION = '33.4'" js/deudas-coordinator-v33-4.js
          grep -q "const VERSION = '33.3'" js/tarjetas-consistencia-v26.js
          if grep -q "state.observer = new MutationObserver" js/tarjetas-consistencia-v26.js; then
            echo "Tarjetas volvió a instalar un observador global" >&2
            exit 1
          fi
          if grep -q "hf-family-card-head" js/deudas-familiares.js; then
            echo "El renderizador visual antiguo volvió a deudas-familiares.js" >&2
            exit 1
          fi

      - name: Verificar identidad y navegación
        run: |
          grep -q "identidad-navegacion-v34.css?v=" js/experiencia-unificada-v32.js
          grep -q "identidad-navegacion-v34.js?v=34.0" js/experiencia-unificada-v32.js
          grep -q "const VERSION = '34.0'" js/identidad-navegacion-v34.js
          grep -q "hf-nav-avatar" js/identidad-navegacion-v34.js
          grep -q "openAjustesModal" js/identidad-navegacion-v34.js
          grep -q "removeHeaderSettings" js/identidad-navegacion-v34.js
          if grep -q "hf-nav-avatar-label" js/identidad-navegacion-v34.js; then
            echo "La etiqueta Ajustes volvió al botón central" >&2
            exit 1
          fi
          grep -q "app-icon.svg?v=34.0" manifest.json
          grep -q "app-icon-maskable.svg?v=34.0" manifest.json
          grep -q "hf-nav-avatar-ready" css/identidad-navegacion-v34.css
          grep -q ".app-header .settings-btn" css/identidad-navegacion-v34.css

      - name: Verificar avatar flotante y contraste V34.1 beta
        if: github.ref_name == 'etapa-17-nav-avatar-flotante'
        run: |
          grep -qx "34.1-beta.2" VERSION
          grep -q "34.1-beta.2" manifest.json
          grep -q "const VERSION = '34.1-beta.2'" js/experiencia-unificada-v32.js
          grep -q -- "--hf-nav-avatar-rise: 20px" css/identidad-navegacion-v34.css
          grep -q "top: calc(-1 \* var(--hf-nav-avatar-rise))" css/identidad-navegacion-v34.css
          grep -q "position: absolute" css/identidad-navegacion-v34.css
          grep -q "align-items: center" css/identidad-navegacion-v34.css
          grep -q "prefers-color-scheme: dark" css/identidad-navegacion-v34.css
          grep -q "color-scheme: light" css/identidad-navegacion-v34.css
          grep -q "hogar-finanzas-v34-1-beta2-avatar-contraste" firebase-messaging-sw.js

      - name: Verificar estados pagados y ahorro real V35 beta 2
        if: github.ref_name == 'etapa-18-estados-pagados-y-ahorro-real'
        run: |
          grep -qx "35.0-beta.2" VERSION
          grep -q '"version": "35.0-beta.2"' manifest.json
          grep -q "const VERSION = '35.0-beta.2'" js/experiencia-unificada-v32.js
          grep -q "hotfix-etapa-18-beta2.css?v=35.0-beta.2" js/experiencia-unificada-v32.js
          grep -q "hotfix-etapa-18-beta2.js?v=35.0-beta.2" js/experiencia-unificada-v32.js
          grep -q "diagnostico-etapa-18.js?v=35.0-beta.2" js/experiencia-unificada-v32.js
          grep -q "deriveCardPaymentState" js/estados-pagados-ahorro-real-v35.js
          grep -q "reservadoMeses" js/estados-pagados-ahorro-real-v35.js
          grep -q "nota:note" js/hotfix-etapa-18-beta2.js
          grep -q "migrateUntrackedGoalBalances" js/hotfix-etapa-18-beta2.js
          grep -q "deriveCardState" js/hotfix-etapa-18-beta2.js
          grep -q "Monto inicial a reservar" js/hotfix-etapa-18-beta2.js
          grep -q "hf-v35-summary-saving-action" js/ahorro-resumen-v35.js
          grep -q "HFDiagnosticoEtapa18" js/diagnostico-etapa-18.js
          grep -q "35.0-beta.2" js/diagnostico-etapa-18.js
          grep -q "hogar-finanzas-v35-beta2-pagos-ahorro-corregidos" firebase-messaging-sw.js
          if grep -q "El ahorro ahora se separa de verdad" css/hotfix-etapa-18-beta2.css; then
            echo "Volvió el mensaje informativo que debía retirarse" >&2
            exit 1
          fi