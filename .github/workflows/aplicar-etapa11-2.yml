name: Aplicar Etapa 11.2.1

on:
  push:
    branches:
      - etapa-11-2-motor-importacion
    paths:
      - 'js/deudas-inteligentes.js'
      - 'css/deudas-inteligentes.css'
      - '.github/workflows/aplicar-etapa11-2.yml'

permissions:
  contents: write

jobs:
  integrar:
    if: ${{ !contains(github.event.head_commit.message, '[auto-etapa11-2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: etapa-11-2-motor-importacion
          fetch-depth: 0

      - name: Integrar archivos en index y caché
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          css_ref = '  <link rel="stylesheet" href="css/deudas-inteligentes.css?v=11.2.1">'
          if 'css/deudas-inteligentes.css' not in text:
              text = text.replace('</head>', f'{css_ref}\n</head>')

          js_ref = '  <script src="js/deudas-inteligentes.js?v=11.2.1"></script>'
          if 'js/deudas-inteligentes.js' not in text:
              text = text.replace('</body>', f'{js_ref}\n</body>')

          index.write_text(text, encoding='utf-8')

          sw = Path('firebase-messaging-sw.js')
          if sw.exists():
              st = sw.read_text(encoding='utf-8')
              st = re.sub(r"const CACHE_NAME = ['\"][^'\"]+['\"]", "const CACHE_NAME = 'hogar-finanzas-v3-etapa11-2-1'", st, count=1)
              marker = "'./css/deudas-inteligentes.css?v=11.2.1'"
              if marker not in st:
                  st = st.replace("'./js/importaciones.js?v=11.1', './css/importaciones.css?v=11.1',", "'./js/importaciones.js?v=11.1', './css/importaciones.css?v=11.1', './js/deudas-inteligentes.js?v=11.2.1', './css/deudas-inteligentes.css?v=11.2.1',")
              sw.write_text(st, encoding='utf-8')
          PY

      - name: Validar JavaScript
        run: node --check js/deudas-inteligentes.js

      - name: Guardar integración
        run: |
          if git diff --quiet; then
            echo 'No hay cambios adicionales.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html firebase-messaging-sw.js
          git commit -m 'Etapa 11.2.1: activa centro integral de tarjetas [auto-etapa11-2]'
          git push origin etapa-11-2-motor-importacion
