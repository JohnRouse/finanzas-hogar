name: Aplicar versión final

on:
  push:
    paths:
      - '.deploy_chunks/READY'

permissions:
  contents: write

jobs:
  apply-build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Reconstruir y aplicar paquete
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy_chunks/chunk_* > /tmp/build.b64
          base64 --decode /tmp/build.b64 > /tmp/build.zip
          rm -rf /tmp/build
          mkdir -p /tmp/build
          unzip -q /tmp/build.zip -d /tmp/build
          cp -a /tmp/build/finanzas-hogar-v2-disponible/. .
          rm -rf .deploy_chunks
          rm -f .github/workflows/apply-generated-build.yml

      - name: Validar JavaScript y manifiesto
        shell: bash
        run: |
          node --check js/app.js
          node --check js/data.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"

      - name: Publicar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Actualiza Hogar Finanzas con gestión completa" || exit 0
          git push origin master
